name: Commit Message Lint

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Commit Messages
        run: |
          REGEX="^DEXO-[0-9]+ - .+"
          
          # Fetch the commits for this push/PR
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            COMMITS=$(git log --format=%B ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          else
            # For pushes, just check the latest commit (or you could check all new commits)
            COMMITS=$(git log --format=%B -n 1 ${{ github.sha }})
          fi
          
          # The git log output can be multi-line for a single commit.
          # We'll split by commit if there are multiple, but for simplicity we can just
          # check the first line of the log output which is the commit subject.
          
          SUBJECT=$(echo "$COMMITS" | head -n 1)
          
          if [[ "$SUBJECT" =~ ^Merge.* ]] || [[ "$SUBJECT" =~ ^Revert.* ]]; then
            echo "✅ Merge or Revert commit allowed: $SUBJECT"
            exit 0
          fi
          
          if [[ ! "$SUBJECT" =~ $REGEX ]]; then
            echo "❌ Error: Commit message does not match required format."
            echo "   Message: '$SUBJECT'"
            echo "   Required format: 'DEXO-<issue_number> - <message>'"
            echo "   Example: 'DEXO-1 - Add new feature'"
            exit 1
          fi
          
          echo "✅ Commit message format is valid."
