[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dexo"
version = "2.0.0"
description = "Production-grade LangGraph agent — multi-provider, hybrid memory, full observability"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    # ── LangChain / LangGraph ────────────────────────────────────────────────
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",

    # ── LLM Providers ────────────────────────────────────────────────────────
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",       # Gemini
    "langchain-ollama>=0.2.0",             # Ollama (gemma4:26b, llama3 …)

    # ── Memory Backends ───────────────────────────────────────────────────────
    "mem0ai>=0.1.0",
    "zep-python>=2.0.0",
    "psycopg[binary,pool]>=3.1.0",
    "pgvector>=0.3.0",

    # ── Web / API ─────────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # ── Security / Auth ───────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # ── Observability ─────────────────────────────────────────────────────────
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.26.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "opentelemetry-instrumentation-httpx>=0.47b0",
    "opentelemetry-instrumentation-asyncpg>=0.47b0",
    "openinference-instrumentation-langchain>=0.1.0",

    # ── MCP ───────────────────────────────────────────────────────────────────
    "mcp>=1.0.0",

    # ── Templating & Utilities ────────────────────────────────────────────────
    "jinja2>=3.1.0",
    "tenacity>=9.0.0",
    "structlog>=24.0.0",
    "anyio>=4.4.0",
    "tiktoken>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",         # HTTPX mocking
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "rich>=13.0.0",          # Pretty CLI output
    "ipython>=8.0.0",
]

# ── Tool configuration ────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["ANN", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["_test\\.py$"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["*_test.py", "**/__init__.py"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
